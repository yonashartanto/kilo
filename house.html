<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duplo House</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#1a1a2e; font-family:sans-serif; }
  #ui { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:10px; align-items:center; color:#fff; background:rgba(0,0,0,.45); padding:8px 14px; border-radius:20px; }
  button { background:#4f8cff; color:#fff; border:none; padding:8px 16px; border-radius:14px; font-size:15px; }
  #step { font-size:14px; min-width:220px; text-align:center; }
  #hint { position:fixed; top:10px; width:100%; text-align:center; color:#aaa; font-size:12px; }
  @media (orientation:portrait) { #hint::after { content:" — rotate phone for best view"; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="hint">Drag to rotate &bull; pinch/scroll to zoom &bull; buttons build the house step by step</div>
<div id="ui">
  <button onclick="step(-1)">&#9664;</button>
  <div id="step"></div>
  <button onclick="step(1)">&#9654;</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(12, 9, 14);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.prepend(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2.5, 0);

scene.add(new THREE.AmbientLight(0xffffff, .5));
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(8, 12, 6);
scene.add(dir);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(30,30), new THREE.MeshStandardMaterial({color:0x232344}));
ground.rotation.x = -Math.PI/2;
scene.add(ground);

const H = 1.2, studGeo = new THREE.CylinderGeometry(.3,.3,.18,12);
function brick(x,z,sx,sz,color){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color, roughness:.4});
  const body = new THREE.Mesh(new THREE.BoxGeometry(sx, H, sz), mat);
  body.position.y = H/2;
  g.add(body);
  for(let i=0;i<sx;i++) for(let j=0;j<sz;j++){
    const s = new THREE.Mesh(studGeo, mat);
    s.position.set(i+.5-sx/2, H+.09, j+.5-sz/2);
    g.add(s);
  }
  g.position.set(x-4, 0, z-3);
  return g;
}

const RED=0xd32f2f, YEL=0xfbc02d, GRN=0x388e3c;
const steps = [
 [[0,0,4,2,RED],[6,0,2,2,RED],[0,4,4,2,RED],[4,4,4,2,RED],[0,2,2,2,YEL],[6,2,2,2,YEL]],
 [[0,0,2,4,YEL],[0,4,2,2,YEL],[6,0,2,4,YEL],[6,4,2,2,YEL],[2,4,4,2,YEL],[2,0,2,2,YEL]],
 [[0,0,4,2,RED],[4,0,4,2,RED],[0,4,4,2,RED],[4,4,4,2,RED],[0,2,2,2,YEL],[6,2,2,2,YEL]],
 [[0,0,2,4,YEL],[0,4,2,2,YEL],[6,0,2,4,YEL],[6,4,2,2,YEL],[2,4,4,2,YEL],[2,0,4,2,YEL]],
 [[1,1,4,2,GRN],[5,1,2,2,GRN],[1,3,4,2,GRN],[5,3,2,2,GRN]],
 [[2,2,4,2,GRN]],
 [[3,2,2,2,RED]]
];
const labels = ["Step 1 - layer 1 (door gap)","Step 2 - layer 2 (door open)","Step 3 - layer 3 (door closed)","Step 4 - layer 4","Step 5 - roof 1","Step 6 - roof 2","Step 7 - roof cap"];

const groups = steps.map((layer,i)=>{
  const g = new THREE.Group();
  layer.forEach(b => g.add(brick(b[0],b[1],b[2],b[3],b[4])));
  g.position.y = i*H;
  g.visible = false;
  scene.add(g);
  return g;
});
const ui = document.getElementById('step');
let cur = 0;
function show(i){
  groups.forEach((g,k)=> g.visible = k <= i);
  ui.textContent = labels[i] + ' (' + (i+1) + '/7)';
}
window.step = d => { cur = Math.min(6, Math.max(0, cur+d)); show(cur); };
show(0);

(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
